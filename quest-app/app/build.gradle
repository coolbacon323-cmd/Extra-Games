plugins {
    id "com.android.application"
}

android {
    namespace "com.extragames.quest"
    compileSdk 35

    defaultConfig {
        applicationId "com.extragames.quest"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            // The CI runner supplies Android's debug signing key so the generated
            // APK is a real installable APK. A production store release should
            // replace this with a private release keystore.
            initWith signingConfigs.debug
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}
