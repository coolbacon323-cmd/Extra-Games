name: Build Extra Games Windows Launcher

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ !contains(github.event.head_commit.message, 'Build Windows launcher EXE') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build Windows installer
        run: npm run dist

      - name: Copy installer into launcher folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path launcher | Out-Null
          Copy-Item "release\\Extra-Games-Launcher-Setup-*.exe" "launcher\\Extra-Games-Launcher-Setup.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: extra-games-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Commit current installer into launcher folder
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/Extra-Games-Launcher-Setup.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Windows launcher EXE"
            git push
          }

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
