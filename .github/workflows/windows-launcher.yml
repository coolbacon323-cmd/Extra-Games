name: Build Extra Games Launcher
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-installer:
    if: ${{ !contains(github.event.head_commit.message, 'Build Windows launcher EXE') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build Windows installer
        run: npm run dist

      - name: Copy EXE into launcher folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path launcher | Out-Null
          Copy-Item "release/Extra-Games-Launcher-Setup.exe" "launcher/Extra-Games-Launcher-Setup.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: extra-games-launcher-windows
          path: release/Extra-Games-Launcher-Setup.exe

      - name: Commit EXE into launcher folder
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/*.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Windows launcher EXE"
            git push
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Extra-Games-Launcher-Setup.exe
          generate_release_notes: true

