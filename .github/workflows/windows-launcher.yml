name: Build Extra Games Windows Launcher

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extra-games-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check app.js
          node --check server.js
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/updater.js
          node --check scripts/smoke-test.js

      - name: Run server smoke test
        run: npm test

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: extra-games-windows-installer
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release with updater metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
